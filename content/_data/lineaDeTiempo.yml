  texto: "Las fichas suman competencias, método scout, valores y tipos de actividad."
  tipo: sitio

- fecha: "2026-06-22"
  titulo: "Versión imprimible con QR"
  texto: "Cada ficha se puede imprimir o guardar en PDF, con un QR que lleva a la versión en línea."
  tipo: sitio

- fecha: "2026-10-25"
  titulo: "Gran puesta a punto"
  texto: "Buscador y filtros nuevos, imágenes livianas, publicación automática y rediseño de la portada y del listado de actividades."
  tipo: sitio

- fecha: "2026-10-26"
  titulo: "Licencias y permisos"
  texto: "Al revisar con más cuidado veo que no todo es libre: varias fuentes no permiten publicar sin autorización. Escribo a los titulares pidiendo permiso, dejo en espera lo no autorizado y me enfoco en lo que es de dominio público o tiene licencias abiertas. El contenido propio va con CC BY-NC-SA 4.0 y el código con MIT."
  tipo: licencia
  enlace: "/licencia/"

- fecha: "2026-10-29"
  titulo: "Homenaje a Baden-Powell"
  texto: "Empiezan las fichas basadas en Scouting for Boys. El 1/11 se completa el libro y se suma el Wolf Cub's Handbook para la Manada."
  tipo: fuente

- fecha: "2026-11-03"
