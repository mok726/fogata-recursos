# Hitos de la línea de tiempo (/linea-de-tiempo/) cargados a mano.
#
# Las insignias nuevas, las tandas grandes de fichas y las cantidades
# redondas de fichas publicadas se agregan SOLAS desde el historial de
# git en cada build: no hace falta cargarlas acá.
#
# Cada hito:
#   - fecha: "2019-03-15"   # vale "2019", "2019-03", "2019-03-15" o texto
#                           # libre como "aprox. 2015" (se ordena por el año)
#     titulo: "Título corto"
#     texto: "Una o dos líneas (opcional)."
#     tipo: inicio          # inicio, fuente, sitio, insignia, permiso,
#                           # licencia, redes, otro (define el ícono)
#     enlace: "/acerca-de/" # opcional: ruta del sitio o URL completa
#
# El orden no importa: se ordenan por fecha al construir el sitio.

# ========== ANTES DEL REPO (completar) ==========

