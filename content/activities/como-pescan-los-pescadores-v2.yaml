# Cómo Pescan los Pescadores

## Resumen
Organiza un debate sobre la sostenibilidad de diferentes métodos y equipos de pesca.

## Preparación
1. Investiga diferentes equipos y prácticas de pesca.
2. Asigna a cada persona un tipo de equipo de pesca para investigar.
3. Prepara argumentos para el debate.

## Desarrollo
1. **Investigación** (20 min): Cada persona investiga su tipo de equipo de pesca.
2. **Presentación** (20 min): Cada persona presenta por qué su forma de pesca es mejor.
3. **Preguntas** (15 min): El público hace preguntas.
4. **Votación** (10 min): El público vota por la forma de pesca más sostenible.

## Cierre
- ¿Qué método de pesca es más sostenible?
- ¿Cómo afectan los diferentes equipos al medio ambiente?
- ¿Qué compromiso adquieres para consumir pescado sostenible?

---
## Texto original completo de la actividad

**C.07 Cómo Pescan los Pescadores**

Materiales: acceso a internet o a libros de referencia para obtener fotografías e información sobre diferentes equipos de pesca (por ej. www.fao.org/fishery/geartype/search/es; www.youtube.com/watch?v=g1TPeM9EAK0; www.youtube.com/watch/?v=MdkU678ZwjA).

Organiza un debate sobre la sostenibilidad de la pesca y el uso de diferentes equipos y prácticas de pesca. Cada persona del grupo debe investigar sobre las ventajas y las desventajas de un tipo diferente de equipo de pesca. Es posible que también deseen buscar información sobre las diferencias entre la pesca artesanal y la pesca industrial. Cada persona debe hacer una presentación corta sobre por qué su forma de pesca es mejor. Una vez que hayan terminado sus presentaciones, inviten al público a realizar preguntas. Cuando todas las preguntas hayan sido discutidas, pidan al público que vote por la forma de pesca que considera que es más sostenible.

