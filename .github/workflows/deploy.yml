# Construye el sitio y lo publica en GitHub Pages en cada push a main.
# En los pull requests sólo construye (sirve para ver que no se rompió).
#
# Requiere: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se publica sólo el último.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: la landing ordena por fecha de alta
      # de cada actividad (primer commit del archivo).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las miniaturas tardan ~1,5 min en generarse desde cero.
      # Se guardan entre corridas; make-thumbs.js sólo regenera
      # las que cambiaron (compara por hash del contenido).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/thumbs
            .cache/thumbs-manifest.json
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
