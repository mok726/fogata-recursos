# Construye el sitio y lo publica en GitHub Pages en cada push a main.
# En los pull requests sólo construye (sirve para ver que no se rompió).
# Además corre todos los días a las 07:00 (hora argentina) para
# cambiar la «Actividad del día» y anunciarla en redes (job anunciar).
#
# Requiere: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * *"   # 07:00 en Argentina (UTC-3)
  workflow_dispatch:
    inputs:
      anunciar:
        description: "Anunciar la actividad del día en redes"
        type: choice
        default: ninguna
        options: [ninguna, todas, telegram, mastodon, bluesky, facebook, instagram, threads]

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se publica sólo el último.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: la landing ordena por fecha de alta
      # de cada actividad (primer commit del archivo).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las miniaturas tardan ~1,5 min en generarse desde cero.
      # Se guardan entre corridas; make-thumbs.js sólo regenera
      # las que cambiaron (compara por hash del contenido).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/thumbs
            .cache/thumbs-manifest.json
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: actividad-del-dia
          path: docs/actividad-del-dia.json
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publica la actividad del día en las redes que tengan secrets
  # cargados (ver .github/scripts/anunciar.mjs). Corre después del
  # deploy, así el link ya funciona.
  anunciar:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.anunciar != 'ninguna')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: actividad-del-dia
      - run: node .github/scripts/anunciar.mjs actividad-del-dia.json
        env:
          # A mano se elige la red. El cron usa la variable del repo
          # REDES_CRON (Settings → Secrets and variables → Actions →
          # Variables), p. ej. «todas» o «telegram,facebook». Sin la
          # variable, publica solo en Telegram y Facebook.
          REDES: ${{ inputs.anunciar || vars.REDES_CRON || 'telegram,facebook' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
