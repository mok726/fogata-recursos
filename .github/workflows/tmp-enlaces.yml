# TEMPORAL: se borra antes de mergear. Verifica los enlaces con la config nueva.
name: TMP enlaces
on:
  push:
    branches: [claude/project-thread-29sfcd]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/sin-texto-original.sh
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --scheme http --scheme https --scheme file
            --root-dir ${{ github.workspace }}
            --accept 200..=299,403,405,429 --max-concurrency 8 --timeout 30 --max-retries 2
            "_enlaces/content/activities/*.md" "_enlaces/content/_data/badges.js"
          output: lychee/out.md
          fail: false
      - run: grep -E '^\* \[|^### |Total|Errors|Timeouts' lychee/out.md | sed 's/^/OUT /'
