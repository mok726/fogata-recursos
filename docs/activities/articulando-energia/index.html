<h1>Articulando Energía</h1>
<h2>Resumen</h2>
<p>Juego de tarjetas para definir conceptos energéticos sin palabras clave.</p>
<h2>Desarrollo</h2>
<p>Crea tarjetas con términos como 'renovable' o 'sostenible'. Por turnos, descríbelos sin usar la palabra. Los demás adivinan.</p>
<h2>Cierre</h2>
<p>¿Qué término fue más difícil de explicar?</p>
