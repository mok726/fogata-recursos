<h1>Pan con Burbujas</h1>
<h2>Resumen</h2>
<p>Hornea pan y observa cómo el CO₂ lo hace esponjar.</p>
<h2>Desarrollo</h2>
<p>Usa levadura o bicarbonato para hornear pan. Observa cómo las burbujas de CO₂ elevan la masa. Sigue una receta segura.</p>
<h2>Cierre</h2>
<p>¿Qué otros alimentos usan CO₂? ¿Por qué es importante este gas?</p>
