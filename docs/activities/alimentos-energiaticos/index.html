<h1>Alimentos Energéticos</h1>
<h2>Resumen</h2>
<p>Juego de emparejar alimentos con su huella energética.</p>
<h2>Desarrollo</h2>
<p>Prepara tarjetas con alimentos (ej: carne, verduras) y su energía de producción (ej: 25 kcal de energía por 1 kcal de carne).</p>
<h2>Cierre</h2>
<p>¿Qué alimento te sorprendió por su huella? ¿Cambiarías tu dieta?</p>
