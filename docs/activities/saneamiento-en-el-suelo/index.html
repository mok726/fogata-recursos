<h1>Saneamiento en el Suelo</h1>
<h2>Resumen</h2>
<p>Investiga cómo el suelo filtra el agua.</p>
<h2>Desarrollo</h2>
<p>Recolecta muestras de suelo y realiza un experimento para ver cómo el suelo remueve impurezas del agua.</p>
<h2>Cierre</h2>
<p>Discute cómo el suelo actúa como un filtro natural.</p>
