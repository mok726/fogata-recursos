<h1>Reducir, Reusar, Reciclar</h1>
<h2>Resumen</h2>
<p>Demuestra la jerarquía de las 3R con cajas de cartón.</p>
<h2>Desarrollo</h2>
<p>Apila 3 cajas (grande=Reducir, mediana=Reusar, pequeña=Reciclar). Discute por qué este orden es más sostenible.</p>
<h2>Cierre</h2>
<p>¿Qué artículo fue más difícil de clasificar? ¿Por qué?</p>
