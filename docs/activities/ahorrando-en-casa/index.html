<h1>Ahorrando en Casa</h1>
<h2>Resumen</h2>
<p>Audita el consumo energético de tu hogar y propón mejoras.</p>
<h2>Desarrollo</h2>
<p>Revisa facturas de luz/agua. Identifica gastos innecesarios (ej: stand-by) y sugiere cambios a tu familia (ej: bombillas LED).</p>
<h2>Cierre</h2>
<p>¿Qué cambio generó mayor impacto? ¿Cómo medirán resultados?</p>
