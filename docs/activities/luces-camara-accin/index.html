<h1>¡Luces, Cámara, Acción!</h1>
<h2>Resumen</h2>
<p>Produce un video o obra teatral sobre cómo ahorrar energía.</p>
<h2>Desarrollo</h2>
<p>En equipo, escriban un guión (ej: 'Un día sin electricidad'). Graben con celular o actúen frente a la comunidad.</p>
<h2>Cierre</h2>
<p>¿Qué mensaje tuvo mayor impacto en la audiencia?</p>
