<h1>A Desempolvar los Libros Viejos</h1>
<h2>Resumen</h2>
<p>Lee un libro donde el suelo juegue un papel importante.</p>
<h2>Desarrollo</h2>
<p>Elige un libro (como 'Jack y los Frijoles Mágicos') y analiza cómo el suelo afecta la historia.</p>
<h2>Cierre</h2>
<p>Discute con el grupo cómo el suelo influye en la trama y los personajes.</p>
