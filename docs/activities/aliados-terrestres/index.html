<h1>Aliados Terrestres</h1>
<h2>Resumen</h2>
<p>Investiga cómo las plantas y animales ayudan a mantener el suelo saludable.</p>
<h2>Desarrollo</h2>
<p>Elige un organismo (como las lombrices) y enumera todas las formas en que ayuda al suelo.</p>
<h2>Cierre</h2>
<p>Presenta tus hallazgos al grupo y discute la importancia de estos aliados.</p>
