<h1>Teatro del Carbono</h1>
<h2>Resumen</h2>
<p>Crea una obra o video sobre el ciclo del carbono.</p>
<h2>Desarrollo</h2>
<p>Investiga el ciclo del carbono y representa sus etapas con una obra de teatro, títeres o video. ¡Sé creativo!</p>
<h2>Cierre</h2>
<p>¿Qué parte del ciclo fue más difícil de representar? ¿Cómo mejorarías tu obra?</p>
