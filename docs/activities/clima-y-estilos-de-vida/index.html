<h1>Clima y estilos de vida</h1>
<h2>Resumen</h2>
<p>Los participantes investigan cómo el clima afecta la calidad de vida.</p>
<h2>Desarrollo</h2>
<p>Los participantes examinan cómo el clima influye en los viajes, la recreación y el bienestar. Luego, preparan un cartel con sus hallazgos.</p>
<h2>Cierre</h2>
<p>Los carteles se exhiben en grupo.</p>
