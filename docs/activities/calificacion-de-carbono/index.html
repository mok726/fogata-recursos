<h1>Calificación de Carbono</h1>
<h2>Resumen</h2>
<p>Analiza emisiones de CO₂ por país y crea un póster.</p>
<h2>Desarrollo</h2>
<p>Investiga la huella de carbono de tu país vs. otros. Diseña un mapa o gráfico comparativo con datos reales.</p>
<h2>Cierre</h2>
<p>¿Qué factores explican las diferencias entre países?</p>
