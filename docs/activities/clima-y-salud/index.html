<h1>Clima y salud</h1>
<h2>Resumen</h2>
<p>Los participantes investigan cómo el clima afecta la salud.</p>
<h2>Desarrollo</h2>
<p>Los participantes estudian una enfermedad relacionada con el clima, como la malaria, y preparan una presentación sobre su conexión con el clima.</p>
<h2>Cierre</h2>
<p>La presentación se comparte con el grupo.</p>
