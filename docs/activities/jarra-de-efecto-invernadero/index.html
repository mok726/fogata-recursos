<h1>Jarra de efecto invernadero</h1>
<h2>Resumen</h2>
<p>Los participantes realizan un experimento para entender el efecto invernadero.</p>
<h2>Desarrollo</h2>
<p>Los participantes usan una jarra y termómetros para medir cómo el calor se acumula en un espacio cerrado.</p>
<h2>Cierre</h2>
<p>Los resultados se discuten en grupo.</p>
