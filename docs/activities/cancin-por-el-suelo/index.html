<h1>Canción por el Suelo</h1>
<h2>Resumen</h2>
<p>Crea una canción sobre los factores que dañan el suelo.</p>
<h2>Desarrollo</h2>
<p>Inventa una canción que hable sobre la contaminación, la erosión y otros problemas del suelo.</p>
<h2>Cierre</h2>
<p>Interpreta la canción con el grupo y reflexiona sobre cómo podemos proteger el suelo.</p>
