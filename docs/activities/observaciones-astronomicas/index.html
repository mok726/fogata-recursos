<h1>Observaciones astronómicas</h1>
<h2>Resumen</h2>
<p>Los participantes investigan cómo la órbita de la Tierra afecta el clima.</p>
<h2>Desarrollo</h2>
<p>Los participantes investigan cómo la inclinación del eje de la Tierra y su órbita afectan el clima a lo largo de miles de años.</p>
<h2>Cierre</h2>
<p>Los hallazgos se presentan en grupo.</p>
