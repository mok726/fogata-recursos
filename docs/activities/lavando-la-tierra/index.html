<h1>Lavando la Tierra</h1>
<h2>Resumen</h2>
<p>Observa cómo el agua erosiona diferentes tipos de suelo.</p>
<h2>Desarrollo</h2>
<p>Vierte agua sobre diferentes tipos de suelo (arena, arcilla, etc.) y observa cómo se erosionan.</p>
<h2>Cierre</h2>
<p>Discute cómo la erosión afecta el suelo y cómo podemos prevenirla.</p>
