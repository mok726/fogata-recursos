<h1>C.07 TU DEPORTE</h1>
<h2>Resumen</h2>
<p>Inventa un deporte que se juegue en el bosque y explora su relación con el entorno.</p>
<h2>Desarrollo</h2>
<p>Inventa un deporte y juégalo en el bosque. ¿Cómo ayuda el medio ambiente del bosque a tu deporte?</p>
<h2>Cierre</h2>
<p>¿Qué elementos naturales incorporaste en tu deporte?</p>
