<h1>Arte futurista</h1>
<h2>Resumen</h2>
<p>Los participantes imaginan cómo será su ciudad en 100 años debido al cambio climático.</p>
<h2>Desarrollo</h2>
<p>Los participantes dibujan cómo creen que será su ciudad en el futuro, considerando los efectos del cambio climático.</p>
<h2>Cierre</h2>
<p>Los dibujos se exhiben en clase.</p>
