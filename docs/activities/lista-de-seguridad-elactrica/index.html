<h1>Lista de Seguridad Eléctrica</h1>
<h2>Resumen</h2>
<p>Identifica riesgos energéticos en casa/escuela.</p>
<h2>Desarrollo</h2>
<p>Recorre tu casa con un adulto buscando peligros eléctricos (cables pelados, sobrecargas). Crea una lista de correcciones.</p>
<h2>Cierre</h2>
<p>¿Qué riesgo te sorprendió más? ¿Cómo promoverás seguridad?</p>
