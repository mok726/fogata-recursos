<h1>Ideas Internacionales</h1>
<h2>Resumen</h2>
<p>Compara hábitos energéticos con amigos de otros países.</p>
<h2>Desarrollo</h2>
<p>Entrevista a alguien de otra cultura sobre su uso de energía (ej: transporte, cocina). Contrasta con tus hábitos.</p>
<h2>Cierre</h2>
<p>¿Qué práctica adoptarías de otra cultura?</p>
