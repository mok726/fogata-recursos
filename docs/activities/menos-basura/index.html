<h1>¡Menos Basura!</h1>
<h2>Resumen</h2>
<p>Organiza una jornada de limpieza para recoger basura en tu comunidad.</p>
<h2>Desarrollo</h2>
<p>Recoge basura en tu ciudad y deséchala adecuadamente. Reflexiona sobre cómo la basura afecta el suelo.</p>
<h2>Cierre</h2>
<p>Discute cómo podemos prevenir que se arroje más basura.</p>
