<h1>Agua invisible</h1>
<h2>Resumen</h2>
<p>Los participantes aprenden sobre el agua invisible en los productos que usan.</p>
<h2>Desarrollo</h2>
<p>Los participantes crean un cartel donde registran cuánta agua invisible usan en un día.</p>
<h2>Cierre</h2>
<p>El cartel se exhibe en grupo para reflexionar sobre el uso del agua.</p>
