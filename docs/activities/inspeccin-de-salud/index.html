<h1>Inspección de Salud</h1>
<h2>Resumen</h2>
<p>Investiga cómo la contaminación afecta la salud y prepara un quiz.</p>
<h2>Desarrollo</h2>
<p>Busca datos sobre enfermedades vinculadas a la polución (ej: asma). Diseña un cuestionario para tu familia/grupo.</p>
<h2>Cierre</h2>
<p>¿Qué dato fue más alarmante? ¿Cómo reducir riesgos?</p>
