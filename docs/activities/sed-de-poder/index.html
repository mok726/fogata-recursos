<h1>Sed de Poder</h1>
<h2>Resumen</h2>
<p>Juego para aprender sobre pobreza energética global.</p>
<h2>Desarrollo</h2>
<p>Con un mapa mundial, los participantes señalan países al azar y describen su acceso a energía. Verifican datos reales después.</p>
<h2>Cierre</h2>
<p>¿Qué región tiene mayores desafíos? ¿Cómo ayudar?</p>
